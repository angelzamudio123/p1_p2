<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html lang="en">
<!-- Etiqueta principal que contiene todo el documento HTML -->

<head>
    <!-- Contiene información y configuraciones de la página -->

    <meta charset="UTF-8">
    <!-- Permite utilizar caracteres especiales como ñ, á, é, í, ó, etc. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página se adapte a diferentes tamaños de pantalla -->

    <title>Salto de linea en HTML</title>
    <!-- Define el título que aparece en la pestaña del navegador -->

</head>

<body>
    <!-- Contiene todo el contenido visible de la página -->

    <h1>Lenguaje de programacion</h1>
    <!-- h1 crea el título principal de la página -->

    <p>
        <!-- La etiqueta p se utiliza para crear un párrafo -->

        En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br>
        <!-- br sirve para hacer un salto de línea -->

        Dart<br>
        <!-- br hace que el siguiente texto aparezca en otra línea -->

        Flutter<br>
        <!-- Salto de línea -->

        Python<br>
        <!-- Salto de línea -->

        Ruby<br>
        <!-- Salto de línea -->

        Java<br>
        <!-- Salto de línea -->

        TypeScript<br>
        <!-- Salto de línea -->

        Entre otros.
        <!-- Texto final del párrafo -->

    </p>
    <!-- Fin del párrafo -->

</body>
<!-- Fin del contenido visible de la página -->

</html>
<!-- Fin del documento HTML -->

<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html lang="en">
<!-- Contiene todo el documento HTML -->

<head>
    <!-- Contiene información y configuraciones de la página -->

    <meta charset="UTF-8">
    <!-- Permite utilizar caracteres especiales como ñ, á, é, etc. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite que la página se adapte a diferentes tamaños de pantalla -->

    <title>Imagenes en HTML</title>
    <!-- Define el título que aparece en la pestaña del navegador -->

</head>

<body>
    <!-- Contiene todo el contenido visible de la página -->

    <h2>Imagenes en HTML</h2>
    <!-- h2 crea un encabezado de segundo nivel -->

    <h3>Locales</h3>
    <!-- h3 crea un encabezado de tercer nivel -->
    <!-- Esta sección muestra una imagen guardada en la computadora -->

    <img src="caritas.png" alt="Imagen de carita feliz">
    <!-- <img> sirve para insertar una imagen en la página -->
    <!-- src indica la ubicación o dirección de la imagen -->
    <!-- alt proporciona un texto alternativo si la imagen no puede mostrarse -->

    <h3>Locales redismensionado</h3>
    <!-- Encabezado para mostrar una imagen local con un tamaño específico -->

    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <!-- src indica que la imagen está dentro de la carpeta "imagenes" -->
    <!-- width establece el ancho de la imagen en 200 píxeles -->
    <!-- height establece la altura de la imagen en 100 píxeles -->
    <!-- alt contiene el texto alternativo de la imagen -->

    <h3>Desde internet</h3>
    <!-- Encabezado para mostrar una imagen obtenida desde internet -->

    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <!-- src contiene la dirección URL de una imagen que está en internet -->
    <!-- width establece el ancho en 200 píxeles -->
    <!-- height establece la altura en 200 píxeles -->
    <!-- alt proporciona un texto alternativo para la imagen -->

    <h3>Animaciones</h3>
    <!-- Encabezado para mostrar una imagen animada -->

    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
    <!-- Esta imagen es un GIF animado obtenido desde internet -->
    <!-- width establece el ancho en 200 píxeles -->
    <!-- height establece la altura en 200 píxeles -->
    <!-- alt proporciona un texto alternativo para la imagen -->

</body>
<!-- Fin del contenido visible de la página -->

</html>
<!-- Fin del documento HTML -->

<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html lang="en">
<!-- Contiene todo el documento HTML -->

<head>
    <!-- Contiene información y configuraciones de la página -->

    <meta charset="UTF-8">
    <!-- Permite utilizar caracteres especiales como ñ, á, é, etc. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite que la página se adapte a diferentes tamaños de pantalla -->

    <title>Enlaces en HTML</title>
    <!-- Define el título que aparece en la pestaña del navegador -->

</head>

<body>
    <!-- Contiene todo el contenido visible de la página -->

    <h2>Tipos de enlaces en HTML</h2>
    <!-- h2 crea un encabezado de segundo nivel -->

    <p>
        <strong>Enlaces/Hipervinculos a otra pagina del
        mismo sitio.
        </strong>
    </p>
    <!-- <p> crea un párrafo -->
    <!-- <strong> muestra el texto con mayor énfasis, normalmente en negritas -->
    <!-- Esta sección habla de enlaces hacia otras páginas del mismo sitio -->

    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!-- <a> crea un enlace o hipervínculo -->
    <!-- href indica la dirección o archivo al que llevará el enlace -->
    <!-- <br> hace un salto de línea -->

    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <!-- target="_self" abre el enlace en la misma pestaña -->

    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <!-- target="_blank" abre el enlace en una pestaña nueva -->

    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <!-- target="_parent" abre el enlace en el marco o ventana padre -->

    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <!-- target="_top" abre el enlace en la ventana completa del navegador -->

    <p>
        <strong>Enlaces/Hipervinculos a sitios externos
        </strong>
    </p>
    <!-- Esta sección contiene enlaces hacia sitios web externos -->

    <a href="https://www.google.com/">Google</a><br>
    <!-- href contiene la dirección completa del sitio web externo -->

    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <!-- target="_self" abre YouTube en la misma pestaña -->

    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <!-- target="_blank" abre Facebook en una pestaña nueva -->

    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <!-- target="_parent" abre el enlace en el marco o ventana padre -->

    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
    <!-- target="_top" abre el enlace en la ventana completa -->

</body>
<!-- Fin del contenido visible de la página -->

</html>
<!-- Fin del documento HTML -->
